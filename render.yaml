services:
  - type: web
    name: takadear
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENCRYPTION_SECRET
        generateValue: true
      - key: API_SIGNING_SECRET
        generateValue: true
